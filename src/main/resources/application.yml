spring:
  application:
    name: library-backend
  datasource:
    url: jdbc:h2:file:./data/library;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  cors-origin: http://localhost:5173
  demo-user:
    enabled: true
    id: demo-user
    type: INTERNAL
    level: L2
    department-id: demo
    department-name: Demo Department
