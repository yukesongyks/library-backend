server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: library-backend
  datasource:
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.library.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
library:
  jwt:
    secret: library-backend-jwt-secret-key-2026-please-change-in-production-env
    expire-hours: 24
  borrow:
    period-days: 30
    max-borrow-count: 5

logging:
  level:
    com.library: debug
    org.springframework.web: info
