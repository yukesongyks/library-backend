server:
  port: 8080

spring:
  application:
    name: library-backend
  # H2 内嵌数据库配置
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 日志配置
logging:
  level:
    root: INFO
    com.library: DEBUG
